# Replace only the paths and, when necessary, column names.
paths:
  stellar_repo: /path/to/snap-stanford/stellar
  reference_csv: /path/to/reference_cells_min40_auto_annotated_astro_ref_v5.csv
  target_count_csv: /path/to/count_table_target.csv
  target_points_csv: /path/to/target_regions_genes.csv
  output_dir: /path/to/output_directory

reference:
  label_column: auto_label_v5
  confidence_column: auto_confidence_v5
  keep_confidence: [high, medium]  # null keeps all confidence levels
  min_total_counts: 40
  min_cells_per_label: 10
  balance: true
  max_cells_per_label: 250
  exclude_labels: [Unresolved, unknown, Unknown, nan, None]
  gene_columns: null               # recommended: list genes explicitly when possible
  non_gene_columns: []             # add numeric metadata columns here if needed
  label_map:
    "CA_Glut (CA1/CA3)": Excitatory_Neuron
    CA_Glut: Excitatory_Neuron
    DG_Glut: Excitatory_Neuron
    GABA_Neuron: GABA_Neuron
    Astro-Epen: Astro-Epen
    Astro: Astro-Epen
    Astrocyte: Astro-Epen
    Ependymal: Astro-Epen
    Immune: Immune
    Microglia: Immune
    "Immune / Microglia": Immune
    Microglia-like: Immune
    Vascular: Vascular
    Endothelial: Vascular
    Pericyte: Vascular
    VLMC: Vascular
    OPC-Oligo: OPC-Oligo
    OPC: OPC-Oligo
    Oligo: OPC-Oligo
    Oligodendrocyte: OPC-Oligo

target:
  min_total_counts: 40
  remove_background_cell_zero: true

graph:
  mode: knn
  k: 3
  radius: 80.0                 # used only when mode: radius
  make_undirected: true
  partition_parts: 4           # manuscript setting; use 1 if graph partitioning is unavailable

training:
  seed: 1
  target_sum: 10000
  epochs: 60
  learning_rate: 0.001
  weight_decay: 0.0

plots:
  enabled: true
  invert_y: false
  point_size: 7
  dpi: 300
  polygon_z_half_width: 2
  split_excitatory_by_region: true  # visualization only; does not change model predictions
  excitatory_label: Excitatory_Neuron
  ca_plot_label: CA_GLUT
  dg_plot_label: DG_GLUT
  ca_like_regions: [CA1, CA3, SO]
  colors:
    CA_GLUT: "#FF1493"
    DG_GLUT: "#00D5FF"
    Excitatory_Neuron: "#00D5FF"
    GABA_Neuron: "#D95CE5"
    OPC-Oligo: "#0B1B8C"
    Astro-Epen: "#684E25"
    Immune: "#8C5A3C"
    Vascular: "#9E9E9E"
    Uncertain: "#D0D0D0"
